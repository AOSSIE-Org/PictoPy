name: Issue Triage

on:
  issues:
    types: [opened, edited]

# Each job asks for only what it needs, so code that reads issues cannot write.
permissions: {}

jobs:
  welcome-comment:
    if: |
      github.event.action == 'opened' &&
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Add comment to issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 Thanks for opening this issue! The maintainers will review it shortly. Till then, do not open any PR. This is a strict rule we like to follow around here :)"
            })

  detect-duplicates:
    # Label or assignee edits also fire "edited"; only title and body affect matching.
    if: |
      github.event.action == 'opened' ||
      github.event.changes.title || github.event.changes.body
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    concurrency:
      group: duplicate-detection-${{ github.event.issue.number }}
      cancel-in-progress: true
    outputs:
      comment: ${{ steps.analyse.outputs.comment }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/scripts/duplicate_detection/requirements.txt

      # Fetch before installing third-party packages, so the token never reaches them.
      - name: Fetch existing issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/duplicate_detection/issue_corpus.py "$GITHUB_REPOSITORY" corpus.json

      # Hash-pinned wheels only, so no package can run build code during install.
      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r .github/scripts/duplicate_detection/requirements.txt

      # The model revision is pinned in the detector, so its hash keys the cache.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: embedding-model-${{ hashFiles('.github/scripts/duplicate_detection/detect_duplicate_issue.py') }}

      - name: Find similar issues
        id: analyse
        run: |
          python .github/scripts/duplicate_detection/detect_duplicate_issue.py corpus.json "$GITHUB_EVENT_PATH" \
            matches.json comment.md
          {
            echo "comment<<COMMENT_EOF"
            cat comment.md
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

  post-comment:
    needs: detect-duplicates
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # One writer per issue at a time, so two runs cannot both create a comment.
    concurrency:
      group: duplicate-detection-comment-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Post or update the suggestion comment
        uses: actions/github-script@v7
        env:
          COMMENT: ${{ needs.detect-duplicates.outputs.comment }}
        with:
          script: |
            // Must match MARKER in .github/scripts/duplicate_detection/duplicate_comment.py.
            const marker = "<!-- pictopy-duplicate-detection -->";
            const body = process.env.COMMENT.trim();
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            };

            // A later edit runs detection again; this result describes older text.
            const { data: current } = await github.rest.issues.get(issue);
            const analysed = context.payload.issue;
            if (current.title !== analysed.title ||
                (current.body || "") !== (analysed.body || "")) {
              core.notice("The issue changed after detection ran; leaving it to the newer run.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(
              c => c.user.type === "Bot" && c.body.includes(marker)
            );

            const safe = async (fn) => {
              try { await fn(); }
              catch (e) { core.notice(`Skipped write action: ${e.message}`); }
            };

            if (body && existing) {
              await safe(() => github.rest.issues.updateComment({
                owner: issue.owner, repo: issue.repo, comment_id: existing.id, body
              }));
            } else if (body) {
              await safe(() => github.rest.issues.createComment({ ...issue, body }));
            } else if (existing) {
              // An edited issue no longer matches, so the old suggestion is stale.
              await safe(() => github.rest.issues.deleteComment({
                owner: issue.owner, repo: issue.repo, comment_id: existing.id
              }));
            } else {
              core.notice("No similar issues found.");
            }
