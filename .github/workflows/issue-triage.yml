name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome-comment:
    if: |
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest

    steps:
      - name: Add comment to issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 Thanks for opening this issue! The maintainers will review it shortly. Till then, do not open any PR. This is a strict rule we like to follow around here :)"
            })

  detect-duplicates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fetch before installing third-party packages, so only standard-library code
      # runs with the token.
      - name: Fetch upstream issues (AOSSIE-Org/PictoPy)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/issue_corpus.py AOSSIE-Org/PictoPy corpus.json

      - name: Install dependencies
        run: |
          pip install --no-cache-dir sentence-transformers

      - name: Run semantic similarity analysis
        run: python .github/scripts/detect_duplicate_issue.py corpus.json "$GITHUB_EVENT_PATH" matches.json

      - name: Comment and soft-label in fork (non-blocking)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const matches = JSON.parse(fs.readFileSync("matches.json", "utf8"));

            if (matches.length === 0) {
              core.notice("No semantic duplicates found.");
              return;
            }

            const list = matches.map((m, i) => {
              const alsoReported = m.also_reported_as.length
                ? `\n   Also reported as ${m.also_reported_as.map(n => `#${n}`).join(", ")}`
                : "";
              return (
                `${i + 1}. **${m.title}** (#${m.number}, ${m.status})\n` +
                `   ${m.url}\n` +
                `   Similarity: ${m.score}%` +
                alsoReported
              );
            }).join("\n\n");

            const safe = async (fn) => {
              try { await fn(); }
              catch (e) { core.notice(`Skipped write action: ${e.message}`); }
            };

            await safe(() =>
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body:
                  `⚠️ **Potential Duplicate Issue (Semantic Match)**\n\n` +
                  `This issue appears semantically similar to the following issues in AOSSIE-Org/PictoPy:\n\n` +
                  `${list}\n\n` +
                  `Please review before proceeding.`
              })
            );

            const labelName = "possible-duplicate";

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
            } catch (e) {
              if (e.status === 404) {
                await safe(() =>
                  github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color: "FBCA04",
                    description: "Potential semantic duplicate (upstream comparison)"
                  })
                );
              }
            }

            await safe(() =>
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [labelName]
              })
            );
