name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  welcome-comment:
    if: |
      github.event.action == 'opened' &&
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest

    steps:
      - name: Add comment to issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 Thanks for opening this issue! The maintainers will review it shortly. Till then, do not open any PR. This is a strict rule we like to follow around here :)"
            })

  detect-duplicates:
    # Label or assignee edits also fire "edited"; only title and body affect matching.
    if: |
      github.event.action == 'opened' ||
      github.event.changes.title || github.event.changes.body
    runs-on: ubuntu-latest
    concurrency:
      group: duplicate-detection-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fetch before installing third-party packages, so only standard-library code
      # runs with the token.
      - name: Fetch upstream issues (AOSSIE-Org/PictoPy)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/issue_corpus.py AOSSIE-Org/PictoPy corpus.json

      - name: Install dependencies
        run: |
          pip install --no-cache-dir sentence-transformers

      - name: Run semantic similarity analysis
        run: python .github/scripts/detect_duplicate_issue.py corpus.json "$GITHUB_EVENT_PATH" matches.json comment.md

      - name: Post or update the suggestion comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            // Must match MARKER in .github/scripts/duplicate_comment.py.
            const marker = "<!-- pictopy-duplicate-detection -->";
            const body = fs.readFileSync("comment.md", "utf8");
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            };

            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(
              c => c.user.type === "Bot" && c.body.includes(marker)
            );

            const safe = async (fn) => {
              try { await fn(); }
              catch (e) { core.notice(`Skipped write action: ${e.message}`); }
            };

            if (body && existing) {
              await safe(() => github.rest.issues.updateComment({
                owner: issue.owner, repo: issue.repo, comment_id: existing.id, body
              }));
            } else if (body) {
              await safe(() => github.rest.issues.createComment({ ...issue, body }));
            } else if (existing) {
              // A retitled issue no longer matches, so the old suggestion is stale.
              await safe(() => github.rest.issues.deleteComment({
                owner: issue.owner, repo: issue.repo, comment_id: existing.id
              }));
            } else {
              core.notice("No similar issues found.");
            }
