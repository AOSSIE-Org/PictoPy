name: PR Compliance Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  
concurrency:
  group: compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Check PR compliance
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Run compliance check
        uses: actions/github-script@v7
        with:
          script: |
            const checkCompliance = require('./.github/scripts/pr-compliance.cjs');
            await checkCompliance({ github, context, core });
